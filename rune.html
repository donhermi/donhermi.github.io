<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runen-Konverter | Latin to Elder Futhark</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --stone-gray: #2d2d2d;
            --gold-accent: #d4af37;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--stone-gray);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        h1 {
            text-align: center;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            font-style: italic;
            color: #888;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #111;
            border: 1px solid var(--gold-accent);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .output-container {
            background: #222;
            min-height: 100px;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--gold-accent);
            position: relative;
        }

        #runeOutput {
            font-size: 28px;
            word-wrap: break-word;
            color: var(--gold-accent);
            line-height: 1.5;
        }

        .copy-btn {
            margin-top: 15px;
            background: var(--gold-accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .copy-btn:hover {
            background: #f1c40f;
            transform: scale(1.05);
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Runen-Konverter</h1>
        <p class="subtitle">Wandle lateinische Buchstaben in das ältere Futhark um</p>

        <textarea id="userInput" placeholder="Tippe hier deinen Text..."></textarea>

        <div class="output-container">
            <div id="runeOutput">ᛏᛁᛈᛈᛖ ᚺᛁᛖᚱ...</div>
            <button class="copy-btn" onclick="copyToClipboard()">Kopieren</button>
        </div>
    </div>

    <script>
        // Mapping für Älteres Futhark
        const runeMap = {
            'a': 'ᚨ', 'b': 'ᛒ', 'c': 'ᚲ', 'd': 'ᛞ', 'e': 'ᛖ', 
            'f': 'ᚠ', 'g': 'ᚷ', 'h': 'ᚺ', 'i': 'ᛁ', 'j': 'ᛃ', 
            'k': 'ᚲ', 'l': 'ᛚ', 'm': 'ᛗ', 'n': 'ᚾ', 'o': 'ᛟ', 
            'p': 'ᛈ', 'q': 'ᚲ', 'r': 'ᚱ', 's': 'ᛊ', 't': 'ᛏ', 
            'u': 'ᚢ', 'v': 'ᚠ', 'w': 'ᚹ', 'x': 'ᚲᛊ', 'y': 'ᛁ', 'z': 'ᛉ',
            ' ': ' '
        };

        const input = document.getElementById('userInput');
        const output = document.getElementById('runeOutput');

        input.addEventListener('input', () => {
            const text = input.value.toLowerCase();
            let result = '';

            for (let char of text) {
                result += runeMap[char] || char; 
            }

            output.textContent = result || '...';
        });

        function copyToClipboard() {
            const text = output.textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Runen kopiert!');
            });
        }
    </script>
</body>
</html>
