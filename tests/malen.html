<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D-Handtracking Malen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #video {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid #000;
            opacity: 0.7;
            z-index: 50;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
        }
        #controls button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 5px;
            background-color: #ff4444;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
        }
        #controls button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>

    <!-- Einstellungsmenü -->
    <div id="controls">
        <label>
            Strichstärke:
            <input type="range" id="linewidth" min="1" max="20" value="2">
        </label>
        <label>
            Farbe:
            <input type="color" id="color" value="#000000">
        </label>
        <button id="clearButton">Canvas löschen</button>
    </div>

    <!-- TensorFlow.js und Handpose-Modell laden -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.5.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.5.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.5.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const linewidthInput = document.getElementById('linewidth');
        const colorInput = document.getElementById('color');
        const clearButton = document.getElementById('clearButton');

        // Canvas-Größe an Fenster anpassen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Zeichnungsvariablen
        let isDrawing = false;
        let lastX = null;
        let lastY = null;

        // Video-Stream von der Webcam starten
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => resolve(video);
            });
        }

        // Canvas löschen
        clearButton.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastX = null;
            lastY = null; // Zurücksetzen der letzten Position
            console.log("Canvas gelöscht");
        });

        // Handpose-Modell laden und Tracking starten
        async function runHandpose() {
            const model = await window.handpose.load();
            console.log("Handpose-Modell geladen");

            await setupCamera();
            video.play();

            async function detectHands() {
                const predictions = await model.estimateHands(video);
                console.log("Predictions:", predictions);

                // Canvas leeren ist jetzt über Button, nicht mehr automatisch
                if (predictions.length > 0) {
                    predictions.forEach((prediction) => {
                        const landmarks = prediction.landmarks;
                        let handedness = prediction.handedness || "Unknown";

                        // Debugging
                        console.log(`Handedness: ${handedness}`, landmarks);

                        // Zeigefinger-Spitze (Index 8)
                        const handX = landmarks[8][0];
                        const handY = landmarks[8][1];

                        // Koordinaten in Canvas-Raum umrechnen
                        const x = (handX / video.videoWidth) * canvas.width;
                        const y = (handY / video.videoHeight) * canvas.height;

                        // Zeichnen, wenn Hand offen ist (Abstand zwischen Zeigefinger und Daumen)
                        const thumbX = landmarks[4][0];
                        const thumbY = landmarks[4][1];
                        const distance = Math.sqrt(Math.pow(handX - thumbX, 2) + Math.pow(handY - thumbY, 2));
                        const isOpen = distance > 0.1; // Schwelle für "Hand offen"

                        if (isOpen) {
                            if (lastX !== null && lastY !== null) {
                                ctx.beginPath();
                                ctx.lineWidth = parseInt(linewidthInput.value);
                                ctx.strokeStyle = colorInput.value;
                                ctx.moveTo(lastX, lastY);
                                ctx.lineTo(x, y);
                                ctx.stroke();
                            }
                            lastX = x;
                            lastY = y;
                        } else {
                            lastX = null;
                            lastY = null;
                        }
                    });
                }

                requestAnimationFrame(detectHands);
            }

            detectHands();
        }

        // Programm starten
        runHandpose().catch(err => console.error("Fehler:", err));

        // Fenstergröße anpassen
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
