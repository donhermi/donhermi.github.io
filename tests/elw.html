<!DOCTYPE html>
<html>
<head>
    <title>Elementale Gitterkriege</title>
    <style>
        body {
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            border: 2px solid #ffffff20;
            background: #0f0f1a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #gameInfo {
            font-family: 'Arial', sans-serif;
            color: #e0e0e0;
            position: absolute;
            top: 20px;
            left: 640px;
            background: rgba(20, 20, 40, 0.9);
            padding: 15px;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        #gameInfo h2 {
            margin: 0 0 10px 0;
            color: #00ccff;
            text-shadow: 0 0 5px rgba(0, 204, 255, 0.5);
        }

        button {
            background: linear-gradient(45deg, #00ccff, #0066ff);
            border: none;
            color: white;
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #00e6ff, #0080ff);
        }

        #combatLog {
            margin-top: 15px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        #settingsDiv {
            font-family: 'Arial', sans-serif;
            color: #e0e0e0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 40, 0.95);
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        #settingsDiv h2 {
            color: #00ccff;
            text-shadow: 0 0 5px rgba(0, 204, 255, 0.5);
            margin-bottom: 20px;
        }

        #settingsDiv p {
            margin: 10px 0;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="600" style="display: none;"></canvas>
    <div id="gameInfo" style="display: none;"></div>
    <div id="settingsDiv">
        <h2>Karteneinstellungen</h2>
        <p>Wähle die Größe der Karte:</p>
        <button onclick="startGame(10)">Klein (10x10 Felder)</button><br>
        <button onclick="startGame(20)">Mittel (20x20 Felder)</button><br>
        <button onclick="startGame(30)">Groß (30x30 Felder)</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('gameInfo');
        const settingsDiv = document.getElementById('settingsDiv');

        const TILE_SIZE = 30;
        const NATIONS = ['Luft', 'Erde', 'Wasser', 'Feuer'];
        const COLORS = {
            'Luft': '#b0e0e6', 'Erde': '#8b4513', 
            'Wasser': '#4169e1', 'Feuer': '#ff4500'
        };

        const UNITS = {
            'Luft': { 
                basic: { name: 'Windreiter', cost: 50, atk: 30, def: 20, speed: 3, moved: false, strengths: ['Feuer'], weaknesses: ['Erde'] },
                advanced: { name: 'Sturmlord', cost: 100, atk: 50, def: 35, speed: 4, moved: false, strengths: ['Feuer'], weaknesses: ['Erde'] }
            },
            'Erde': { 
                basic: { name: 'Steingolem', cost: 70, atk: 40, def: 50, speed: 1, moved: false, strengths: ['Luft'], weaknesses: ['Wasser'] },
                advanced: { name: 'Felskoloss', cost: 120, atk: 60, def: 70, speed: 2, moved: false, strengths: ['Luft'], weaknesses: ['Wasser'] }
            },
            'Wasser': { 
                basic: { name: 'Gezeitenkrieger', cost: 60, atk: 35, def: 30, speed: 2, moved: false, strengths: ['Feuer', 'Erde'], weaknesses: [] },
                advanced: { name: 'Ozeanfürst', cost: 110, atk: 55, def: 45, speed: 3, moved: false, strengths: ['Feuer', 'Erde'], weaknesses: [] }
            },
            'Feuer': { 
                basic: { name: 'Flammengeist', cost: 50, atk: 45, def: 25, speed: 2, moved: false, strengths: [], weaknesses: ['Luft', 'Wasser'] },
                advanced: { name: 'Infernoherrscher', cost: 105, atk: 65, def: 40, speed: 3, moved: false, strengths: [], weaknesses: ['Luft', 'Wasser'] }
            }
        };

        let gameState = {
            map: [],
            players: [],
            currentPlayer: 0,
            selectedTile: null,
            targetTile: null,
            currentUnitIndex: 0,
            movingUnits: true,
            combatLog: '',
            gameOver: false,
            mapWidth: 0,
            mapHeight: 0
        };

        class Tile {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.owner = null;
                this.unit = null;
                this.improvement = null;
                this.level = (type === 'Goldmine') ? 1 : 0;
                this.cityLevel = 0;
                this.conquered = false;
            }
        }

        class Player {
            constructor(nation, isAI) {
                this.nation = nation;
                this.isAI = isAI;
                this.gold = 100;
                this.units = [];
                this.hasAdvancedUnit = false;
                this.active = true;
            }
        }

        function startGame(size) {
            gameState.mapWidth = size;
            gameState.mapHeight = size;
            canvas.width = size * TILE_SIZE;
            canvas.height = size * TILE_SIZE;
            infoDiv.style.left = (size * TILE_SIZE + 40) + 'px';
            settingsDiv.style.display = 'none';
            canvas.style.display = 'block';
            infoDiv.style.display = 'block';
            initGame();
        }

        function initGame() {
            gameState.players = [
                new Player('Luft', false),
                new Player('Erde', false),
                new Player('Wasser', false),
                new Player('Feuer', false)
            ];

            gameState.map = [];
            for (let y = 0; y < gameState.mapHeight; y++) {
                gameState.map[y] = [];
                for (let x = 0; x < gameState.mapWidth; x++) {
                    const rand = Math.random();
                    let type = 'Ebene';
                    if (rand < 0.1) type = 'Goldmine';
                    else if (rand < 0.25) type = 'Berg';
                    gameState.map[y][x] = new Tile(x, y, type);
                }
            }

            NATIONS.forEach((nation, i) => {
                let tx, ty;
                do {
                    tx = Math.floor(Math.random() * gameState.mapWidth);
                    ty = Math.floor(Math.random() * gameState.mapHeight);
                } while (gameState.map[ty][tx].improvement);
                
                gameState.map[ty][tx].owner = i;
                gameState.map[ty][tx].unit = { ...UNITS[nation].basic };
                gameState.map[ty][tx].improvement = 'Stadt';
                gameState.map[ty][tx].cityLevel = 1;
                gameState.players[i].units.push(gameState.map[ty][tx]);
            });

            gameState.movingUnits = true;
            drawMap();
            selectNextUnit();
            updateInfo();
        }

        function drawTile(x, y, fill, type) {
            // Create gradient based on tile type
            let gradient = ctx.createLinearGradient(x * TILE_SIZE, y * TILE_SIZE, (x + 1) * TILE_SIZE, (y + 1) * TILE_SIZE);
            if (type === 'Berg') {
                gradient.addColorStop(0, '#999');
                gradient.addColorStop(1, '#666');
            } else if (type === 'Goldmine') {
                gradient.addColorStop(0, '#ffd700');
                gradient.addColorStop(1, '#ccac00');
            } else {
                gradient.addColorStop(0, fill);
                gradient.addColorStop(1, adjustColor(fill, -50));
            }

            ctx.fillStyle = gradient;
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            
            // Add subtle border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }

        function adjustColor(color, amount) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.max(0, Math.min(255, r + amount));
            g = Math.max(0, Math.min(255, g + amount));
            b = Math.max(0, Math.min(255, b + amount));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < gameState.mapHeight; y++) {
                for (let x = 0; x < gameState.mapWidth; x++) {
                    const tile = gameState.map[y][x];
                    let color = '#666';
                    if (tile.type === 'Berg') color = '#999';
                    else if (tile.type === 'Goldmine') color = tile.conquered ? '#ffcc00' : '#ffd700';
                    if (tile.owner !== null) color = COLORS[NATIONS[tile.owner]];
                    if (gameState.selectedTile === tile) color = '#ffffff';
                    if (gameState.targetTile === tile) color = '#ffff00';
                    
                    drawTile(x, y, color, tile.type);
                    
                    // Enhanced unit and improvement visuals
                    if (tile.unit) {
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 12px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('U', x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2 + 4);
                    }
                    if (tile.improvement === 'Stadt') {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                        ctx.fillStyle = '#000000';
                        ctx.font = 'bold 10px Arial';
                        ctx.fillText('S', x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2 + 3);
                    }
                    if (tile.level > 0) {
                        ctx.fillStyle = '#ffd700';
                        ctx.font = 'bold 12px Arial';
                        ctx.fillText(tile.level, x * TILE_SIZE + TILE_SIZE - 10, y * TILE_SIZE + 12);
                    }
                    if (tile.cityLevel > 1) {
                        ctx.fillStyle = '#00ccff';
                        ctx.font = 'bold 12px Arial';
                        ctx.fillText(tile.cityLevel, x * TILE_SIZE + 10, y * TILE_SIZE + TILE_SIZE - 5);
                    }
                }
            }
        }

        function updateInfo() {
            if (gameState.gameOver) {
                const winner = gameState.players.find(p => p.active);
                infoDiv.innerHTML = `
                    <h2>Sieg!</h2>
                    ${winner ? getVictoryMessage(winner.nation) : 'Spiel beendet'}
                    <button onclick="location.reload()">Neues Spiel starten</button>
                `;
                return;
            }

            const p = gameState.players[gameState.currentPlayer];
            if (!p.active) {
                endTurn();
                return;
            }
            const toggleText = p.isAI ? 'Nation wieder übernehmen' : 'Nation an Verwalter (KI) übergeben';
            let tileInfo = '';
            let unitMessage = '';
            let buyButtons = '';
            let moveButton = '';

            if (gameState.selectedTile) {
                const tile = gameState.selectedTile;
                tileInfo = `<br>Feld (${tile.x}, ${tile.y}): `;
                if (tile.type === 'Goldmine') {
                    tileInfo += `Goldmine (Level ${tile.level}, ${tile.level * 10} Gold pro Runde)${tile.conquered ? ' [Erobert]' : ''}`;
                    if (tile.owner === gameState.currentPlayer && tile.level < 3) tileInfo += `<br><button onclick="upgradeTile()">Goldmine verbessern (75g)</button>`;
                } else if (tile.type === 'Berg') {
                    tileInfo += 'Berg (Verteidigungsbonus)';
                } else if (tile.type === 'Ebene') {
                    tileInfo += `Ebene (Level ${tile.level}, ${tile.level || 1} Gold pro Runde)`;
                    if (tile.owner === gameState.currentPlayer && tile.level < 3) tileInfo += `<br><button onclick="upgradeTile()">Ebene verbessern (50g)</button>`;
                }
                if (tile.improvement === 'Stadt') {
                    tileInfo += `<br>Stadt (Level ${tile.cityLevel}, ${tile.cityLevel * 10} Gold pro Runde)`;
                    if (tile.owner === gameState.currentPlayer && tile.cityLevel < 3) {
                        tileInfo += `<br><button onclick="upgradeCity()">Stadt verbessern (150g)</button>`;
                    }
                }
                if (tile.unit && tile.owner === gameState.currentPlayer && !tile.unit.moved && gameState.movingUnits) {
                    unitMessage = `<br>${tile.unit.name} (${tile.x}, ${tile.y}) kann jetzt bewegt werden! Klicke auf ein Ziel oder wähle manuell.`;
                    if (gameState.targetTile) {
                        moveButton = `<br><button onclick="confirmMove()">Einheit nach (${gameState.targetTile.x}, ${gameState.targetTile.y}) bewegen</button>`;
                    }
                }
                if (tile.improvement === 'Stadt' && !tile.unit && tile.owner === gameState.currentPlayer && !gameState.movingUnits) {
                    tileInfo += `<br>Stadt: Einheit kaufbar`;
                    buyButtons = `
                        <button onclick="buyUnit('basic')">${UNITS[p.nation].basic.name} kaufen (${UNITS[p.nation].basic.cost}g)</button><br>
                        ${p.hasAdvancedUnit ? `<button onclick="buyUnit('advanced')">${UNITS[p.nation].advanced.name} kaufen (${UNITS[p.nation].advanced.cost}g)</button>` : ''}
                    `;
                }
            }

            infoDiv.innerHTML = `
                <h2>Aktueller Spieler: ${p.nation} ${p.isAI ? '(KI)' : ''}</h2>
                Gold: <span style="color: #ffd700">${p.gold}</span><br>
                Einheiten: <span style="color: #00ccff">${p.units.length}</span><br>
                ${buyButtons}
                ${gameState.movingUnits ? '<button onclick="restUnit()">Einheit ausruhen</button><br>' : ''}
                <button onclick="buildCity()">Stadt bauen (150g)</button><br>
                <button onclick="toggleAI()">${toggleText}</button><br>
                <button onclick="endTurn()">Zug beenden</button>
                ${unitMessage}
                ${moveButton}
                ${tileInfo}
                <div id="combatLog">${gameState.combatLog}</div>
            `;
        }

        function getVictoryMessage(nation) {
            switch (nation) {
                case 'Luft':
                    return `Die Lüfte triumphieren! Die Windreiter haben die Welt unter ihre Schwingen gebracht, und der Sturm der Herrschaft fegt über das Land. ${nation} regiert unangefochten!`;
                case 'Erde':
                    return `Die Erde erhebt sich siegreich! Die Steingolems haben das Land in einen unzerstörbaren Fels verwandelt, und ${nation} steht als unerschütterlicher Herrscher da!`;
                case 'Wasser':
                    return `Die Gezeiten haben gesiegt! Die Ozeanfürsten haben das Land in einem endlosen Meer ertränkt, und ${nation} herrscht über die Wellen der Ewigkeit!`;
                case 'Feuer':
                    return `Die Flammen lodern unbesiegbar! Die Infernoherrscher haben die Welt in ein Meer aus Feuer getaucht, und ${nation} thront über einem Reich der Asche und Glut!`;
                default:
                    return `${nation} hat gesiegt! Die Elemente beugen sich ihrem Willen!`;
            }
        }

        function checkVictory() {
            const activePlayers = gameState.players.filter(p => {
                const hasTiles = gameState.map.flat().some(t => t.owner === gameState.players.indexOf(p));
                p.active = hasTiles;
                return hasTiles;
            });
            
            if (activePlayers.length <= 1) {
                gameState.gameOver = true;
                if (activePlayers.length === 1) {
                    gameState.currentPlayer = gameState.players.indexOf(activePlayers[0]);
                }
                updateInfo();
            }
        }

        function selectNextUnit() {
            const p = gameState.players[gameState.currentPlayer];
            const movableUnits = gameState.map.flat().filter(tile => 
                tile.unit && tile.owner === gameState.currentPlayer && !tile.unit.moved
            );

            if (movableUnits.length === 0) {
                gameState.selectedTile = null;
                gameState.targetTile = null;
                gameState.movingUnits = false;
                gameState.currentUnitIndex = 0;
                updateInfo();
                return;
            }

            if (gameState.currentUnitIndex >= movableUnits.length) {
                gameState.currentUnitIndex = 0;
            }

            gameState.selectedTile = movableUnits[gameState.currentUnitIndex];
            gameState.movingUnits = true;
            drawMap();
            updateInfo();
        }

        function restUnit() {
            if (!gameState.selectedTile || !gameState.selectedTile.unit || gameState.selectedTile.owner !== gameState.currentPlayer) return;
            gameState.selectedTile.unit.moved = true;
            gameState.combatLog = `${gameState.selectedTile.unit.name} ruht sich aus.`;
            gameState.currentUnitIndex++;
            selectNextUnit();
        }

        function upgradeTile() {
            const p = gameState.players[gameState.currentPlayer];
            const tile = gameState.selectedTile;
            if (!tile || tile.owner !== gameState.currentPlayer || tile.level >= 3 || gameState.movingUnits) return;

            let cost;
            if (tile.type === 'Goldmine') cost = 75;
            else if (tile.type === 'Ebene') cost = 50;
            else return;

            if (p.gold >= cost) {
                p.gold -= cost;
                tile.level += 1;
                gameState.combatLog = `${tile.type} auf Level ${tile.level} verbessert!`;
                drawMap();
                updateInfo();
            }
        }

        function upgradeCity() {
            const p = gameState.players[gameState.currentPlayer];
            const tile = gameState.selectedTile;
            if (!tile || tile.owner !== gameState.currentPlayer || tile.improvement !== 'Stadt' || tile.cityLevel >= 3 || gameState.movingUnits) return;

            const cost = 150;
            if (p.gold >= cost) {
                p.gold -= cost;
                tile.cityLevel += 1;
                if (tile.cityLevel >= 2 && !p.hasAdvancedUnit) {
                    p.hasAdvancedUnit = true;
                    gameState.combatLog = `Stadt auf Level ${tile.cityLevel} verbessert! Die stärkere Einheit ${UNITS[p.nation].advanced.name} ist jetzt verfügbar!`;
                } else {
                    gameState.combatLog = `Stadt auf Level ${tile.cityLevel} verbessert!`;
                }
                drawMap();
                updateInfo();
            }
        }

        function toggleAI() {
            const p = gameState.players[gameState.currentPlayer];
            p.isAI = !p.isAI;
            updateInfo();
            if (p.isAI) endTurn();
        }

        function buyUnit(type) {
            const p = gameState.players[gameState.currentPlayer];
            if (!gameState.selectedTile || gameState.selectedTile.owner !== gameState.currentPlayer || gameState.selectedTile.improvement !== 'Stadt' || gameState.movingUnits) return;
            const unitType = type === 'advanced' && p.hasAdvancedUnit ? 'advanced' : 'basic';
            const unit = UNITS[p.nation][unitType];
            if (p.gold >= unit.cost && !gameState.selectedTile.unit) {
                p.gold -= unit.cost;
                gameState.selectedTile.unit = { ...unit };
                p.units.push(gameState.selectedTile);
                drawMap();
                updateInfo();
            }
        }

        function calculateCombat(attacker, defender, defenderTile) {
            let atkPower = attacker.atk;
            let defPower = defender.def * (defenderTile.type === 'Berg' ? 1.5 : 1);
            const attackerNation = NATIONS[gameState.currentPlayer];
            const defenderNation = NATIONS[defenderTile.owner];
            
            let log = `Kampf: ${attacker.name} (ANG: ${atkPower}) vs ${defender.name} (VER: ${defPower})<br>`;
            
            if (attacker.strengths.includes(defenderNation)) {
                atkPower *= 1.5;
                log += `${attackerNation} stark gegen ${defenderNation}: ANG x1.5 = ${atkPower.toFixed(1)}<br>`;
            }
            if (attacker.weaknesses.includes(defenderNation)) {
                atkPower *= 0.75;
                log += `${attackerNation} schwach gegen ${defenderNation}: ANG x0.75 = ${atkPower.toFixed(1)}<br>`;
            }
            if (defender.strengths.includes(attackerNation)) {
                defPower *= 1.5;
                log += `${defenderNation} stark gegen ${attackerNation}: VER x1.5 = ${defPower.toFixed(1)}<br>`;
            }
            if (defender.weaknesses.includes(attackerNation)) {
                defPower *= 0.75;
                log += `${defenderNation} schwach gegen ${defenderNation}: VER x0.75 = ${defPower.toFixed(1)}<br>`;
            }
            if (defenderTile.type === 'Berg') {
                log += `Bergbonus: VER x1.5 = ${defPower.toFixed(1)}<br>`;
            }

            const totalPower = atkPower + defPower;
            const winChance = atkPower / totalPower;
            const roll = Math.random();
            const attackerWins = roll < winChance;
            
            log += `Siegwahrscheinlichkeit: ${(winChance * 100).toFixed(1)}% | Würfel: ${(roll * 100).toFixed(1)}%<br>`;
            if (attackerWins && defenderTile.improvement === 'Stadt') {
                log += getCityConquestText(attackerNation, defenderNation);
            } else if (attackerWins && defenderTile.type === 'Goldmine') {
                defenderTile.conquered = true;
                log += `${attackerNation} hat die Goldmine von ${defenderNation} erobert! Die Schätze gehören nun uns!`;
            } else {
                log += attackerWins 
                    ? `${attacker.name} besiegt ${defender.name} und besiedelt das Land!` 
                    : `${defender.name} hält stand, ${attacker.name} wird zurückgeschlagen!`;
            }

            gameState.combatLog = log;
            return attackerWins;
        }

        function getCityConquestText(attackerNation, defenderNation) {
            switch (attackerNation) {
                case 'Luft':
                    return `Die Winde des Sieges wehen triumphierend! Die Windreiter haben die Stadt von ${defenderNation} erobert und die Lüfte beanspruchen nun diese Stätte!`;
                case 'Erde':
                    return `Die Erde bebt unter dem Marsch der Steingolems! Die Stadt von ${defenderNation} fällt in die Hände der unerschütterlichen Erdenmacht!`;
                case 'Wasser':
                    return `Die Gezeiten wenden sich! Die Gezeitenkrieger haben die Stadt von ${defenderNation} überschwemmt und die Wellen der Herrschaft übernehmen!`;
                case 'Feuer':
                    return `Flammen lodern siegreich empor! Die Flammengeister haben die Stadt von ${defenderNation} in Asche gelegt und das Feuer regiert nun über diese Stätte!`;
                default:
                    return `${attackerNation} erobert die Stadt von ${defenderNation}!`;
            }
        }

        function settleLand(unit, tile) {
            const nation = NATIONS[gameState.currentPlayer];
            let log = `Besiedlung: ${unit.name} erobert das Land!<br>`;
            log += `Das Feld (${tile.x}, ${tile.y}) gehört jetzt ${nation}.<br>`;
            log += `Die Einheit ${unit.name} hat das Land besiedelt und zieht sich zurück.`;
            if (tile.type === 'Goldmine') {
                tile.conquered = true;
                log += `<br>Die Goldmine wurde erobert und gehört nun ${nation}!`;
            }
            
            gameState.combatLog = log;
            gameState.currentUnitIndex++;
            selectNextUnit();
        }

        function moveUnit(x, y) {
            const p = gameState.players[gameState.currentPlayer];
            if (!gameState.selectedTile || !gameState.selectedTile.unit || gameState.selectedTile.owner !== gameState.currentPlayer || gameState.selectedTile.unit.moved) return;

            const unit = gameState.selectedTile.unit;
            const speed = unit.speed;
            const oldTile = gameState.selectedTile;
            const newTile = gameState.map[y][x];
            const distance = Math.max(Math.abs(newTile.x - oldTile.x), Math.abs(newTile.y - oldTile.y));
            
            if (distance <= speed) {
                if (newTile.owner === gameState.currentPlayer && !newTile.unit) {
                    newTile.unit = unit;
                    oldTile.unit = null;
                    unit.moved = true;
                    gameState.currentUnitIndex++;
                    selectNextUnit();
                } else if (!newTile.owner) {
                    newTile.owner = gameState.currentPlayer;
                    oldTile.unit = null;
                    p.units = p.units.filter(t => t !== oldTile);
                    unit.moved = true;
                    settleLand(unit, newTile);
                } else if (newTile.owner !== gameState.currentPlayer) {
                    if (newTile.unit) {
                        if (calculateCombat(unit, newTile.unit, newTile)) {
                            const oldOwner = newTile.owner;
                            newTile.owner = gameState.currentPlayer;
                            newTile.unit = null;
                            gameState.players[oldOwner].units = gameState.players[oldOwner].units.filter(t => t !== newTile);
                            
                            const defeatedPlayerTiles = gameState.map.flat().filter(t => t.owner === oldOwner);
                            if (defeatedPlayerTiles.length === 0) {
                                gameState.players[oldOwner].active = false;
                                gameState.combatLog += `<br>${NATIONS[oldOwner]} wurde vollständig besiegt!`;
                            }
                        }
                        oldTile.unit = null;
                        p.units = p.units.filter(t => t !== oldTile);
                        unit.moved = true;
                        gameState.currentUnitIndex++;
                        selectNextUnit();
                    } else {
                        const oldOwner = newTile.owner;
                        newTile.owner = gameState.currentPlayer;
                        oldTile.unit = null;
                        p.units = p.units.filter(t => t !== oldTile);
                        unit.moved = true;
                        settleLand(unit, newTile);
                        
                        const defeatedPlayerTiles = gameState.map.flat().filter(t => t.owner === oldOwner);
                        if (defeatedPlayerTiles.length === 0) {
                            gameState.players[oldOwner].active = false;
                            gameState.combatLog += `<br>${NATIONS[oldOwner]} wurde vollständig besiegt!`;
                        }
                    }
                }
                drawMap();
                updateInfo();
                checkVictory();
            } else {
                gameState.combatLog = `Fehler: ${unit.name} kann nur ${speed} Felder weit bewegen!<br>`;
                gameState.combatLog += `Entfernung zum Ziel (${x}, ${y}): ${distance} Felder.`;
                updateInfo();
            }
        }

        function confirmMove() {
            if (gameState.selectedTile && gameState.targetTile && gameState.selectedTile.unit && !gameState.selectedTile.unit.moved) {
                moveUnit(gameState.targetTile.x, gameState.targetTile.y);
                gameState.targetTile = null;
            }
            drawMap();
            updateInfo();
        }

        function buildCity() {
            const p = gameState.players[gameState.currentPlayer];
            if (!gameState.selectedTile || gameState.selectedTile.owner !== gameState.currentPlayer || gameState.selectedTile.improvement || gameState.movingUnits) return;
            if (p.gold >= 150) {
                p.gold -= 150;
                gameState.selectedTile.improvement = 'Stadt';
                gameState.selectedTile.cityLevel = 1;
                drawMap();
                updateInfo();
            }
        }

        function endTurn() {
            if (gameState.gameOver) return;

            let income = 0;
            gameState.map.flat().forEach(tile => {
                if (tile.owner === gameState.currentPlayer) {
                    if (tile.type === 'Goldmine') income += tile.level * 10;
                    else if (tile.type === 'Ebene') income += tile.level || 1;
                    if (tile.improvement === 'Stadt') income += tile.cityLevel * 10;
                }
            });
            gameState.players[gameState.currentPlayer].gold += income;
            
            gameState.map.flat().forEach(tile => {
                if (tile.unit && tile.owner === gameState.currentPlayer) {
                    tile.unit.moved = false;
                }
            });

            let nextPlayer = (gameState.currentPlayer + 1) % 4;
            let attempts = 0;
            while (!gameState.players[nextPlayer].active && attempts < 4) {
                nextPlayer = (nextPlayer + 1) % 4;
                attempts++;
            }
            
            if (attempts >= 4) {
                gameState.gameOver = true;
                updateInfo();
                return;
            }

            gameState.currentPlayer = nextPlayer;
            gameState.selectedTile = null;
            gameState.targetTile = null;
            gameState.currentUnitIndex = 0;
            gameState.movingUnits = true;
            gameState.combatLog = '';
            drawMap();
            selectNextUnit();
            updateInfo();
            
            checkVictory();
            
            if (!gameState.gameOver && gameState.players[gameState.currentPlayer].isAI) setTimeout(aiTurn, 500);
        }

        function getDistance(tile1, tile2) {
            return Math.max(Math.abs(tile1.x - tile2.x), Math.abs(tile1.y - tile2.y));
        }

        function aiTurn() {
            const p = gameState.players[gameState.currentPlayer];
            const ownedTiles = gameState.map.flat().filter(t => t.owner === gameState.currentPlayer);
            const enemyCities = gameState.map.flat().filter(t => t.improvement === 'Stadt' && t.owner !== gameState.currentPlayer && t.owner !== null);
            const enemyGoldmines = gameState.map.flat().filter(t => t.type === 'Goldmine' && t.owner !== gameState.currentPlayer);
            const neutralGoldmines = gameState.map.flat().filter(t => t.type === 'Goldmine' && t.owner === null);

            if (!gameState.movingUnits) {
                let income = ownedTiles.reduce((sum, tile) => {
                    if (tile.type === 'Goldmine') return sum + tile.level * 10;
                    if (tile.type === 'Ebene') return sum + (tile.level || 1);
                    if (tile.improvement === 'Stadt') return sum + tile.cityLevel * 10;
                    return sum;
                }, 0);

                if (p.gold >= 150 && ownedTiles.filter(t => t.improvement === 'Stadt').length > 0) {
                    const cityToUpgrade = ownedTiles
                        .filter(t => t.improvement === 'Stadt' && t.cityLevel < 3)
                        .sort((a, b) => b.cityLevel - a.cityLevel)[0];
                    if (cityToUpgrade) {
                        gameState.selectedTile = cityToUpgrade;
                        upgradeCity();
                        setTimeout(aiTurn, 500);
                        return;
                    }
                }

                if (p.gold >= 150 && ownedTiles.filter(t => t.improvement === 'Stadt').length < 2) {
                    const emptyTile = ownedTiles
                        .filter(t => !t.improvement && t.type !== 'Berg')
                        .sort((a, b) => {
                            const aDist = Math.min(...enemyCities.map(c => getDistance(a, c)));
                            const bDist = Math.min(...enemyCities.map(c => getDistance(b, c)));
                            return aDist - bDist;
                        })[0];
                    if (emptyTile) {
                        gameState.selectedTile = emptyTile;
                        buildCity();
                        setTimeout(aiTurn, 500);
                        return;
                    }
                }

                if (p.gold >= 75 && income < 30) {
                    const goldmineToUpgrade = ownedTiles
                        .filter(t => t.type === 'Goldmine' && t.level < 3)
                        .sort((a, b) => b.level - a.level)[0];
                    if (goldmineToUpgrade) {
                        gameState.selectedTile = goldmineToUpgrade;
                        upgradeTile();
                        setTimeout(aiTurn, 500);
                        return;
                    }
                }

                if (p.gold >= UNITS[p.nation].basic.cost) {
                    const cities = ownedTiles.filter(t => t.improvement === 'Stadt' && !t.unit);
                    if (cities.length > 0) {
                        gameState.selectedTile = cities[0];
                        if (p.hasAdvancedUnit && p.gold >= UNITS[p.nation].advanced.cost && enemyCities.length > 0) {
                            buyUnit('advanced');
                        } else {
                            buyUnit('basic');
                        }
                        setTimeout(aiTurn, 500);
                        return;
                    }
                }

                gameState.movingUnits = true;
                setTimeout(aiTurn, 500);
                return;
            }

            const unitTile = ownedTiles.find(t => t.unit && !t.unit.moved);
            if (unitTile && gameState.movingUnits) {
                gameState.selectedTile = unitTile;
                const unit = unitTile.unit;
                const possibleMoves = [];
                for (let y = 0; y < gameState.mapHeight; y++) {
                    for (let x = 0; x < gameState.mapWidth; x++) {
                        const dist = getDistance(unitTile, gameState.map[y][x]);
                        if (dist <= unit.speed) possibleMoves.push(gameState.map[y][x]);
                    }
                }

                const targets = [
                    ...enemyCities.map(t => ({ tile: t, priority: 10 })),
                    ...enemyGoldmines.map(t => ({ tile: t, priority: 8 })),
                    ...neutralGoldmines.map(t => ({ tile: t, priority: 6 })),
                    ...possibleMoves.filter(t => !t.owner).map(t => ({ tile: t, priority: 2 }))
                ].filter(t => possibleMoves.includes(t.tile));

                if (targets.length > 0) {
                    targets.sort((a, b) => {
                        const distA = getDistance(unitTile, a.tile);
                        const distB = getDistance(unitTile, b.tile);
                        return (b.priority - distA) - (a.priority - distB);
                    });

                    const target = targets[0].tile;
                    moveUnit(target.x, target.y);
                    setTimeout(aiTurn, 500);
                    return;
                } else {
                    const nearestCity = ownedTiles
                        .filter(t => t.improvement === 'Stadt')
                        .sort((a, b) => getDistance(unitTile, a) - getDistance(unitTile, b))[0];
                    if (nearestCity) {
                        const possibleDefensiveMoves = possibleMoves
                            .filter(t => t.owner === gameState.currentPlayer || !t.owner)
                            .sort((a, b) => getDistance(a, nearestCity) - getDistance(b, nearestCity));
                        if (possibleDefensiveMoves.length > 0) {
                            moveUnit(possibleDefensiveMoves[0].x, possibleDefensiveMoves[0].y);
                            setTimeout(aiTurn, 500);
                            return;
                        }
                    }
                }
            }

            gameState.movingUnits = false;
            setTimeout(endTurn, 500);
        }

        canvas.addEventListener('click', (e) => {
            if (gameState.gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const x = Math.floor(mx / TILE_SIZE);
            const y = Math.floor(my / TILE_SIZE);
            
            if (x >= 0 && x < gameState.mapWidth && y >= 0 && y < gameState.mapHeight) {
                if (gameState.movingUnits && gameState.selectedTile && gameState.selectedTile.unit && !gameState.selectedTile.unit.moved) {
                    moveUnit(x, y);
                } else {
                    gameState.selectedTile = gameState.map[y][x];
                    if (gameState.selectedTile.unit && gameState.selectedTile.owner === gameState.currentPlayer && !gameState.selectedTile.unit.moved) {
                        gameState.targetTile = null;
                    } else {
                        gameState.targetTile = null;
                    }
                    drawMap();
                    updateInfo();
                }
            }
        });
    </script>
</body>
