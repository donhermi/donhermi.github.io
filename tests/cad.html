<!DOCTYPE html>
<html>
<head>
    <title>Hermanns CAD</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #canvas { width: 100%; height: 80vh; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; }
        button { margin: 5px; padding: 5px 10px; }
        input { margin: 5px; }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="addShape('cube')">Würfel</button>
        <button onclick="addShape('sphere')">Kugel</button>
        <button onclick="addShape('cylinder')">Zylinder</button>
        <button onclick="deleteSelected()">Auswahl löschen</button><br>
        <label>Position X: <input type="number" id="posX" step="0.1" onchange="updateSelected()"></label><br>
        <label>Position Y: <input type="number" id="posY" step="0.1" onchange="updateSelected()"></label><br>
        <label>Position Z: <input type="number" id="posZ" step="0.1" onchange="updateSelected()"></label><br>
        <label>Skalierung: <input type="number" id="scale" step="0.1" value="1" onchange="updateSelected()"></label><br>
        <label>Rotation X: <input type="number" id="rotX" step="0.1" onchange="updateSelected()"></label><br>
        <label>Rotation Y: <input type="number" id="rotY" step="0.1" onchange="updateSelected()"></label><br>
        <label>Rotation Z: <input type="number" id="rotZ" step="0.1" onchange="updateSelected()"></label><br>
        <label>Farbe: <input type="color" id="color" onchange="updateSelected()"></label><br>
        <button onclick="exportSTL()">STL Export</button>
        <button onclick="exportOBJ()">OBJ Export</button><br>
        <button onclick="document.getElementById('fileInput').click()">Import</button>
        <input type="file" id="fileInput" style="display:none" accept=".stl,.obj,.gltf,.glb" onchange="importFile(event)"><br>
        <button onclick="booleanOperation('union')">Vereinigung</button>
        <button onclick="booleanOperation('subtract')">Subtraktion</button>
        <button onclick="booleanOperation('intersect')">Schnittmenge</button>
    </div>
    <canvas id="canvas"></canvas>

    <!-- Bibliotheken laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Szene einrichten
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight * 0.8);

        // Licht
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Grid als Referenz
        const grid = new THREE.GridHelper(10, 10);
        scene.add(grid);

        // Kamera-Position und Steuerung
        camera.position.set(5, 5, 5);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Loader initialisieren
        const stlLoader = new THREE.STLLoader();
        const objLoader = new THREE.OBJLoader();
        const gltfLoader = new THREE.GLTFLoader();

        // Ausgewähltes Objekt
        let selectedObject = null;
        let secondSelectedObject = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Formen hinzufügen
        function addShape(type) {
            let geometry;
            switch (type) {
                case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
                case 'sphere': geometry = new THREE.SphereGeometry(0.5, 32, 32); break;
                case 'cylinder': geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); break;
            }
            const material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            scene.add(mesh);
            selectObject(mesh);
        }

        // Datei importieren
        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            const reader = new FileReader();

            if (fileName.endsWith('.stl')) {
                reader.onload = function(e) {
                    const geometry = stlLoader.parse(e.target.result);
                    const material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(0, 0, 0);
                    scene.add(mesh);
                    selectObject(mesh);
                };
                reader.readAsArrayBuffer(file);
            } else if (fileName.endsWith('.obj')) {
                reader.onload = function(e) {
                    const object = objLoader.parse(e.target.result);
                    normalizeObject(object);
                    scene.add(object);
                    selectObject(object.children[0] || object);
                };
                reader.readAsText(file);
            } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
                reader.onload = function(e) {
                    gltfLoader.parse(e.target.result, '', (gltf) => {
                        const object = gltf.scene;
                        normalizeObject(object);
                        scene.add(object);
                        selectObject(object.children[0] || object);
                    }, (error) => console.error('GLTF loading error:', error));
                };
                reader.readAsArrayBuffer(file);
            }
            event.target.value = '';
        }

        // Normalize imported objects
        function normalizeObject(object) {
            object.traverse(child => {
                if (child.isMesh && !child.material) {
                    child.material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                }
            });
        }

        // Objekt auswählen
        function selectObject(object) {
            // Clear previous selection
            if (selectedObject) {
                selectedObject.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissive.set(0x000000);
                    }
                });
            }
            
            selectedObject = object;
            
            if (selectedObject) {
                // Highlight selected object
                selectedObject.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissive.set(0x555555);
                    }
                });
                updateControls();
            } else {
                resetControls();
            }
        }

        // Zweites Objekt für Boolean-Operationen auswählen
        function selectSecondObject(object) {
            if (secondSelectedObject) {
                secondSelectedObject.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissive.set(0x000000);
                    }
                });
            }
            
            secondSelectedObject = object;
            
            if (secondSelectedObject) {
                secondSelectedObject.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissive.set(0xaaaaaa);
                    }
                });
            }
        }

        // Steuerung aktualisieren
        function updateControls() {
            if (!selectedObject) return;
            // Use the root object's position/rotation/scale
            document.getElementById('posX').value = selectedObject.position.x;
            document.getElementById('posY').value = selectedObject.position.y;
            document.getElementById('posZ').value = selectedObject.position.z;
            document.getElementById('scale').value = selectedObject.scale.x;
            document.getElementById('rotX').value = selectedObject.rotation.x;
            document.getElementById('rotY').value = selectedObject.rotation.y;
            document.getElementById('rotZ').value = selectedObject.rotation.z;
            
            // Find first mesh for color
            let firstMesh = null;
            selectedObject.traverse(child => {
                if (child.isMesh && child.material && !firstMesh) {
                    firstMesh = child;
                }
            });
            if (firstMesh) {
                document.getElementById('color').value = '#' + firstMesh.material.color.getHexString();
            }
        }

        // Objekt aktualisieren
        function updateSelected() {
            if (!selectedObject) return;
            selectedObject.position.set(
                parseFloat(document.getElementById('posX').value) || 0,
                parseFloat(document.getElementById('posY').value) || 0,
                parseFloat(document.getElementById('posZ').value) || 0
            );
            const scale = parseFloat(document.getElementById('scale').value) || 1;
            selectedObject.scale.set(scale, scale, scale);
            selectedObject.rotation.set(
                parseFloat(document.getElementById('rotX').value) || 0,
                parseFloat(document.getElementById('rotY').value) || 0,
                parseFloat(document.getElementById('rotZ').value) || 0
            );
            
            // Apply color to all meshes
            const color = document.getElementById('color').value;
            selectedObject.traverse(child => {
                if (child.isMesh && child.material) {
                    child.material.color.set(color);
                }
            });
        }

        // Ausgewähltes Objekt löschen
        function deleteSelected() {
            if (selectedObject) {
                scene.remove(selectedObject);
                selectedObject = null;
                resetControls();
            }
            if (secondSelectedObject) {
                scene.remove(secondSelectedObject);
                secondSelectedObject = null;
            }
        }

        // Steuerung zurücksetzen
        function resetControls() {
            document.getElementById('posX').value = '';
            document.getElementById('posY').value = '';
            document.getElementById('posZ').value = '';
            document.getElementById('scale').value = 1;
            document.getElementById('rotX').value = '';
            document.getElementById('rotY').value = '';
            document.getElementById('rotZ').value = '';
            document.getElementById('color').value = '#ffffff';
        }

        // STL-Export
        function exportSTL() {
            const exporter = new THREE.STLExporter();
            const result = exporter.parse(scene);
            downloadFile(result, 'hermanns_cad.stl', 'application/octet-stream');
        }

        // OBJ-Export
        function exportOBJ() {
            const exporter = new THREE.OBJExporter();
            const result = exporter.parse(scene);
            downloadFile(result, 'hermanns_cad.obj', 'text/plain');
        }

        // Datei herunterladen
        function downloadFile(content, fileName, mimeType) {
            const a = document.createElement('a');
            const blob = new Blob([content], { type: mimeType });
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }

        // Mausklick-Ereignisse
        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / (window.innerHeight * 0.8)) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                // Select the topmost parent that contains the intersected mesh
                let obj = intersects[0].object;
                while (obj.parent && obj.parent.type !== 'Scene') {
                    obj = obj.parent;
                }
                selectObject(obj);
            } else {
                selectObject(null);
            }
        });

        renderer.domElement.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / (window.innerHeight * 0.8)) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent.type !== 'Scene') {
                    obj = obj.parent;
                }
                selectSecondObject(obj);
            }
        });

        // Render-Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Fenstergröße anpassen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.8);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
        });
    </script>
</body>
</html>
